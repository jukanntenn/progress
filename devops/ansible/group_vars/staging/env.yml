---
# Environment configuration for staging (oect, arm64).
# The internal registry at 192.168.5.50:5000 runs on the oect host itself.
progress_otlp_endpoint: "http://192.168.5.57:4318"
env: "staging"
registry_url: "192.168.5.50:5000"
image_name: progress
image_tag: main
host_port: 5053
health_url: "http://192.168.5.50:5053"
# Empty => the scheduler idles and pipeline runs are triggered manually
# (docker compose exec progress progress run -c /app/config.toml);
# set a cron expression to schedule them instead.
cron: "30 8,22 * * *"
