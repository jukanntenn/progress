---
# Configures a daily 01:00 cron job on the local machine that runs the
# `observing` skill through `claude --print` inside the progress project.
#
# Local connection — no inventory needed:
#   ansible-playbook devops/ansible/claude-observing-cron.yml
#
# To preview without changing anything:
#   ansible-playbook devops/ansible/claude-observing-cron.yml --check --diff
# To remove the job later:
#   ansible-playbook devops/ansible/claude-observing-cron.yml -e state=absent

- name: Configure daily claude observing cron job
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    home: "{{ lookup('env', 'HOME') }}"
    state: present
    project_path: "{{ home }}/Workspace/progress"
    claude_bin_dir: "{{ home }}/.local/bin"
    log_file: "{{ home }}/.local/log/claude-observing.log"
    claude_command: >-
      claude --dangerously-skip-permissions --effort=max
      --print --output-format=stream-json --verbose "/observing"

  tasks:
    - name: Ensure log directory exists
      ansible.builtin.file:
        path: "{{ log_file | dirname }}"
        state: directory
        mode: "0755"
      when: state == "present"

    - name: Give cron a PATH that includes claude and standard binaries
      ansible.builtin.cron:
        name: PATH
        env: true
        value: "{{ claude_bin_dir }}:/usr/local/bin:/usr/bin:/bin"
        state: "{{ state }}"

    - name: Run claude observing every day at 01:00
      ansible.builtin.cron:
        name: "claude observing"
        minute: "0"
        hour: "1"
        state: "{{ state }}"
        # `/observing` is a project-scoped skill under `.claude/skills/`, so
        # claude must start inside the progress repo to resolve it.
        job: 'cd {{ project_path }} && {{ claude_command }} >> {{ log_file }} 2>&1'
