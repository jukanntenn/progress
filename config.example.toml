# =============================================================================
# Progress Tracker Configuration (Ansible Class)
# =============================================================================
#
# This is the Ansible-class configuration file (spec 02). It is mounted
# read-only in Docker and carries only infrastructure-level settings that
# cannot be changed at runtime. All user-facing settings (language, credentials,
# business tuning) live in the database ``config`` table and are managed via
# the Web UI or the seed file ``config.db.toml``.
#
# Priority: Environment Variables > config file > defaults.
# Environment variable override rules (applied at startup):
#   - Prefix:    PROGRESS_
#   - Separator: __ (double underscore) for nested keys
#   - Examples:  PROGRESS_STATE_HOME="/app/data"
#                PROGRESS_LANGUAGE="zh-hans"
#

# -----------------------------------------------------------------------------
# state_home — root directory for all runtime data
# -----------------------------------------------------------------------------
# Database, logs, cloned repos, and observability exports all live under this
# directory. Relative paths are resolved from the working directory.
# Default: "data"
# Env: PROGRESS_STATE_HOME
state_home = "data"

# [core.github]
# gh_token = ""                       # GitHub token (empty → GitHub tracking disabled)
# proxy = ""                          # HTTP proxy for aiohttp + git (e.g. "http://127.0.0.1:7890")
