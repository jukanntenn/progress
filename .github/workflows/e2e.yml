name: E2E (web)

# Browser e2e against the real production container. Heavy (builds the image +
# installs Playwright browsers), so it only fires when source the e2e actually
# exercise changes — never on docs-only edits.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'web/src/**'
      - 'web/package.json'
      - 'web/pnpm-lock.yaml'
      - 'docker/Dockerfile'
      - 'docker/Caddyfile'
      - 'docker/docker-compose.local.yml'
      - 'web/e2e/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build & start the container
        run: docker compose -f docker/docker-compose.local.yml up -d --build --wait

      - name: Sanity-check healthz
        run: curl -fsS http://localhost:5000/healthz

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/e2e/pnpm-lock.yaml

      - name: Install Playwright deps
        working-directory: web/e2e
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          npx playwright install --with-deps chromium

      - name: Run e2e
        working-directory: web/e2e
        run: pnpm test

      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.local.yml down -v
