name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev
      # HIGH/CRITICAL 阻断 CI(-lll 仅保留 high+critical,-q 安静模式)。
      - name: Run bandit (gate on HIGH/CRITICAL)
        run: uv run bandit -c pyproject.toml -r src/ -lll -q
      # 全量扫描导出 SARIF,上传到 Security tab(含 Medium/Low,仅可视不阻断)。
      # 用项目自带的 JSON→SARIF 转换器(scripts/bandit_to_sarif.py),避免引入
      # 已归档的 bandit-sarif-formatter 依赖(它拖入 pbr/setuptools/sarif-om 且
      # 与 bandit 的 pyproject 配置读取器冲突)。
      - name: Run bandit (full JSON)
        run: uv run bandit -c pyproject.toml -r src/ -f json -o bandit.json || true
      - name: Convert JSON to SARIF
        run: uv run python scripts/bandit_to_sarif.py bandit.json bandit.sarif
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: bandit.sarif
