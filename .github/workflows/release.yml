name: Release

# Publish the multi-arch Docker image to GHCR when a version tag (v*) is pushed,
# then create a GitHub Release with auto-generated notes. No PyPI publishing —
# the project ships as a container only (see docs/deployment.md).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  docker:
    name: Build & push image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # buildx + QEMU are needed for the linux/arm64 leg of the multi-arch
      # build that docker/build.py emits via `docker buildx build --platform`.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"   # v0.1.0 -> 0.1.0
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$version $version-${GITHUB_SHA::7} latest" >> "$GITHUB_OUTPUT"

      # build.py appends "/progress" to the registry and handles the buildx
      # cache ref (--cache-from/--cache-to ghcr.io/jukanntenn/progress:cache).
      - name: Build and push multi-arch image
        run: |
          uv run python docker/build.py \
            --push \
            --registry ghcr \
            --all-platforms \
            --tags ${{ steps.meta.outputs.tags }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: docker
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
