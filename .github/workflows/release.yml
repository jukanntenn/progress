name: Release

# Publish the multi-arch image to GHCR + Docker Hub when a version tag (v*) is
# pushed, then create a GitHub Release with auto-generated notes.
#
# Tag semantics (docker/metadata-action, community standard):
#   v0.1.0   -> 0.1.0 + latest      (stable release)
#   v0.2.3rc1-> 0.2.3rc1            (prerelease: version tag only, no latest)
# The `main` rolling tag is NOT pushed here — it lives on the internal
# registry only (local docker/build.py, see docs/deployment.md).
#
# Multi-arch is built natively (no QEMU): amd64 on ubuntu-latest, arm64 on the
# GitHub arm runner. Each platform pushes a temporary `build-<arch>` tag, a
# merge job combines them into the final manifest lists, then a best-effort
# cleanup removes the temporary tags.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  meta:
    name: Resolve tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/jukanntenn/progress
            jukanntenn/progress
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

  build:
    name: Build & push (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: meta
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          provenance: false
          platforms: ${{ matrix.platform }}
          tags: |
            ghcr.io/jukanntenn/progress:build-${{ matrix.arch }}
            jukanntenn/progress:build-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge:
    name: Merge multi-arch manifests
    runs-on: ubuntu-latest
    needs: [meta, build]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Merge GHCR manifest lists
        env:
          TAGS: ${{ needs.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create \
              -t "ghcr.io/jukanntenn/progress:$tag" \
              "ghcr.io/jukanntenn/progress:build-amd64" \
              "ghcr.io/jukanntenn/progress:build-arm64"
          done <<< "$TAGS"

      - name: Merge Docker Hub manifest lists
        env:
          TAGS: ${{ needs.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create \
              -t "jukanntenn/progress:$tag" \
              "jukanntenn/progress:build-amd64" \
              "jukanntenn/progress:build-arm64"
          done <<< "$TAGS"

  cleanup:
    name: Remove temporary build tags
    runs-on: ubuntu-latest
    needs: merge
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - name: Delete GHCR build tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for arch in amd64 arm64; do
            vid=$(gh api "/user/packages/container/progress/versions" \
              --jq ".[] | select(.metadata.container.tags | index(\"build-$arch\")) | .id" || true)
            if [ -n "$vid" ]; then
              gh api --method DELETE "/user/packages/container/progress/versions/$vid" || true
            fi
          done

      - name: Delete Docker Hub build tags
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for arch in amd64 arm64; do
            curl -sS -o /dev/null -X DELETE \
              -H "Authorization: Bearer $DOCKERHUB_TOKEN" \
              "https://hub.docker.com/v2/repositories/jukanntenn/progress/tags/build-$arch/" || true
          done

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: merge
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
