name: Release

# Publish the multi-arch Docker image to GHCR when a version tag (v*) is pushed,
# then create a GitHub Release with auto-generated notes. No PyPI publishing —
# the project ships as a container only (see docs/deployment.md).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  docker:
    name: Build & push image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # buildx + QEMU are needed for the linux/arm64 leg of the multi-arch
      # build that docker/build.py emits via `docker buildx build --platform`.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"   # v0.1.0 -> 0.1.0
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$version $version-${GITHUB_SHA::7} latest" >> "$GITHUB_OUTPUT"

      # build.py appends "/progress" to the registry and handles the buildx
      # cache ref (--cache-from/--cache-to ghcr.io/jukanntenn/progress:cache).
      - name: Build and push multi-arch image
        run: |
          uv run python docker/build.py \
            --push \
            --registry ghcr \
            --all-platforms \
            --tags ${{ steps.meta.outputs.tags }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: docker
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
