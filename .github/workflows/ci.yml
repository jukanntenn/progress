name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check
      - run: uv run ruff format --check

  typecheck:
    name: Type-check (ty)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run ty check

  lock-drift:
    name: Lockfile drift (uv)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv lock --check

  python-tests:
    name: Python tests (unit / component / e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev
      # .mo catalogs are gitignored build artifacts (spec 11); compile them so
      # i18n tests find translations in a clean checkout.
      - run: uv run python scripts/compile_messages.py
      # The feed e2e suite talks to a real Miniflux + Postgres stack. The
      # github-hosted ubuntu runner ships Docker out of the box (no DinD).
      # Local developers are expected to have Docker running too — the command
      # is identical everywhere: `uv run pytest`.
      - name: Bring up Miniflux stack (for feed e2e)
        run: docker compose -f tests/e2e/feed/docker-compose.yml up -d --wait
      # Coverage is injected via addopts in pyproject.toml, so the bare
      # `pytest` command produces both the terminal report and coverage.xml.
      - run: uv run pytest
      - name: Tear down stack
        if: always()
        run: docker compose -f tests/e2e/feed/docker-compose.yml down -v
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  frontend:
    name: Frontend (format / lint / typecheck / test / build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # pnpm test emits web/coverage/clover.xml via the coverage config in
      # vite.config.ts. Uploaded alongside the backend's coverage.xml so
      # codecov merges both into a single project view.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/clover.xml
          fail_ci_if_error: false

  drift-checks:
    name: Drift + docs checks (OpenAPI / types / i18n / migrations / docs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: uv sync --frozen --extra dev
      - run: pnpm --dir web install --frozen-lockfile

      # Single source of truth for every drift/regression check: deptry,
      # import-linter, OpenAPI, frontend types, i18n .pot + catalog lint,
      # migration drift. Local devs run the exact same command
      # (`uv run python scripts/check_drift.py`), so the two paths can never
      # drift apart.
      - name: Drift checks (deptry / import-linter / OpenAPI / types / i18n / migrations)
        run: uv run python scripts/check_drift.py

      # hdsh documentation gates over the full corpus (bilingual pairing /
      # RFC format / wrap / links / word budgets / adoption completion) — the
      # same commands the prek `hdsh` group runs locally, pinned to the ref
      # prek.toml carries. Same local/CI parity as check_drift.
      - name: Documentation gates (hdsh)
        run: |
          uv tool install "harness-deepseek-harness @ git+https://github.com/jukanntenn/harness-deepseek-harness@8684da520df25a446a10745063d40d72544d5653"
          hdsh pairing verify
          hdsh rfc verify
          hdsh docs wrap
          hdsh docs links
          hdsh docs budgets
          hdsh adopt verify

  docker-build:
    name: Docker image build (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint, typecheck, python-tests, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build the image for the host platform only (no push) to confirm the
      # Dockerfile is healthy. Push happens in release.yml on tags, using the
      # same official build-push-action.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: progress:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
