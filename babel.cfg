# Babel extraction configuration (spec 11)
#
# Workflow:
#   pybabel extract -F babel.cfg -o src/progress/locales/progress.pot .
#   pybabel update -i src/progress/locales/progress.pot -d src/progress/locales -D progress -l zh_hans
#   pybabel compile -d src/progress/locales -D progress
#
# `pybabel extract` ships DEFAULT_KEYWORDS that already cover `_`, `gettext`,
# and `ngettext` (babel/messages/frontend.py), so no explicit `--keyword` flags
# are required.

[python: src/**.py]
encoding = utf-8

[jinja2: src/**/templates/**.j2]
encoding = utf-8
