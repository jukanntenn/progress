# prek configuration — native prek format (https://github.com/j178/prek).
# Run `prek install` once per clone to wire the hooks into `git commit`.

# Out of scope for every hook: AI-agent config dirs, the local contexts cache,
# the venv, runtime data, worktrees, AND committed generated artifacts. prek
# uses `git ls-files` so it already honors .gitignore; this exclude also covers
# untracked-but-present working dirs and tracked generated files that must stay
# verbatim — their bytes are owned by the generator, not by any hook (see
# web/.prettierignore and the agent-hooks design in docs/agent-hooks.md).
#
# This is the workspace-root config, so this exclude is applied GLOBALLY before
# files are distributed to nested projects (e.g. web/prek.toml) — that is why
# the web/ generated artifacts are listed here rather than only in web/prek.toml
# (root builtin hooks like end-of-file-fixer would otherwise mutate them).
# web/prek.toml repeats them for the `cd web && prek run` / `-c` case.
exclude = '''(?x)^(
    (?:\.agents|\.claude|\.codex|\.zcode|\.local|\.venv|data|\.worktrees)/
  | src/progress/locales/.*\.pot$
  | web/openapi\.json$
  | web/src/api/schema\.ts$
)'''

# ---- ruff (backend lint + format) ----------------------------------------
# Local hooks calling `uv run ruff` so the version is pinned by pyproject's
# dev extra (no separate `rev` to drift out of sync).
[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "ruff check --fix"
language = "system"
entry = "uv run ruff check --fix"
files = "\\.py$"
groups = ["lint"]

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
language = "system"
entry = "uv run ruff format"
files = "\\.py$"
groups = ["format"]

# ---- ty (backend type check) ---------------------------------------------
[[repos.hooks]]
id = "ty-check"
name = "ty check"
language = "system"
entry = "uv run ty check"
files = "\\.py$"
pass_filenames = false

# ---- frontend (eslint + prettier) → moved to web/prek.toml (workspace) ---
# prek discovers web/prek.toml as a nested project: eslint/prettier run with
# CWD = web/ and web-relative paths, so no run-hook.sh shim is needed. The
# agent hooks' --group {format,lint} routing is unchanged because web/prek.toml
# keeps the same group names.

# ---- builtin hygiene (Rust-native, zero network) -------------------------
[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"
groups = ["format"]

[[repos.hooks]]
id = "end-of-file-fixer"
groups = ["format"]

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "mixed-line-ending"
groups = ["format"]

[[repos.hooks]]
id = "check-added-large-files"

# Secret content scan (filename protection is handled by .gitignore).
[[repos.hooks]]
id = "detect-private-key"

# ---- bandit (SAST) --------------------------------------------------------
# Gates on HIGH/CRITICAL only (-lll); Medium/Low surface in CI SARIF for the
# Security tab but don't block local commits. Config lives in pyproject.toml.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "bandit"
name = "bandit (src/)"
language = "system"
entry = "uv run bandit -c pyproject.toml -r src/ -lll -q"
files = "\\.py$"
pass_filenames = false

# ---- translation catalog check ------------------------------------------
[[repos]]
repo = "local"

[[repos.hooks]]
id = "check-translations"
name = "check-translations (no fuzzy / empty / obsolete)"
entry = "uv run python scripts/check_translations.py"
language = "system"
pass_filenames = false
files = "src/progress/locales/.*\\.po$"

# ---- import layering / cycle guard (import-linter) -----------------------
# Guards the layered architecture and the cycle fixes (e.g. parse_created_at
# moved to utils.timezone, _NotFoundException lifted to errors.py). Runs on any
# src/ change since import edges shift across the whole tree.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "import-linter"
name = "import-linter (no forbidden cross-layer imports)"
entry = "uv run lint-imports --no-cache"
language = "system"
pass_filenames = false
files = "^src/progress/.*\\.py$"

# ---- drift / regression checks (mirror CI's drift-checks job) -------------
# Identical command to CI (scripts/check_drift.py is the single source of
# truth), so a green local commit cannot fail the CI drift-checks job:
# deptry / import-linter / OpenAPI / frontend types / i18n .pot + catalog /
# migration drift. Also the lockfile check CI runs in its own job.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "drift-check"
name = "drift checks (same command as CI)"
entry = "uv run python scripts/check_drift.py"
language = "system"
pass_filenames = false

[[repos.hooks]]
id = "lock-check"
name = "uv lock --check"
entry = "uv lock --check"
language = "system"
pass_filenames = false
